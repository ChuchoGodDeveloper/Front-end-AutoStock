name: CI Code Quality

on:
  push:
    branches:
      - main
      - develop
      - sprint1
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
      - sprint1

jobs:
  code-quality:
    name: Lint, Typecheck y Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Análisis estático (ESLint)
        run: npm run lint

      - name: Verificación de tipos (TypeScript)
        run: npm run typecheck

      - name: Build de producción (Vite + PWA)
        run: npm run build
